<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Мастер-класс</title>
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 20px 16px;
    }
    .hero {
      text-align: center;
      margin-bottom: 24px;
    }
    .hero img {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: #222;
      margin-bottom: 16px;
    }
    .hero .greeting {
      font-size: 22px;
      font-weight: 600;
      margin: 0 0 6px;
    }
    .hero .name {
      font-size: 18px;
      color: #4a90e2;
      margin: 0;
    }
    .video-wrap {
      background: #1a1a1a;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
    }
    .video-wrap iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="hero">
      <img id="userPhoto" alt="">
      <div class="greeting">Добро пожаловать!</div>
      <div id="userName" class="name">…</div>
    </div>

    <div class="video-wrap">
      <iframe
        src="https://rutube.ru/play/embed/82fa1c7bc611d6719be8e3a4d4566e62/"
        allow="clipboard-write; autoplay; fullscreen; encrypted-media; picture-in-picture"
        allowfullscreen
        webkitallowfullscreen
        mozallowfullscreen></iframe>
    </div>
  </div>

  <script>
    vkBridge.send('VKWebAppInit')
      .then(() => vkBridge.send('VKWebAppGetUserInfo'))
      .then(user => {
        document.getElementById('userPhoto').src = user.photo_100 || '';
        document.getElementById('userName').textContent =
          `${user.first_name} ${user.last_name}`;
      })
      .catch(err => console.error('VK Bridge error:', err));
  </script>
</body>
</html>
