<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Мастер-класс</title>
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100vh;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <iframe
    src="https://rutube.ru/play/embed/82fa1c7bc611d6719be8e3a4d4566e62/"
    allow="clipboard-write; autoplay; fullscreen; encrypted-media; picture-in-picture"
    allowfullscreen
    webkitallowfullscreen
    mozallowfullscreen>
  </iframe>
  <script>
    // Обязательная инициализация VK Bridge — без неё ВК будет крутить прелоадер
    vkBridge.send('VKWebAppInit');
  </script>
</body>
</html>
